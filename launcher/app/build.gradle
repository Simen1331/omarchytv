plugins {
    id 'com.android.application'
}

android {
    namespace 'com.omarchytv.home'
    compileSdk 34

    defaultConfig {
        applicationId 'com.omarchytv.home'
        // Lowered 26 -> 25 for Fire TV Stick 4K gen 1 (AFTMM, Fire OS 6 / Android 7.1).
        minSdk 25
        targetSdk 34
        versionCode 20
        versionName '2.12.0-omarchytv'
    }

    buildTypes {
        release {
            // R8: the launcher plus only the Media3 parts it calls (exoplayer core; no ui, hls, dash).
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    lint {
        // The launcher is sideloaded over ADB, never published to Google Play, so Play's minimum targetSdk
        // does not apply; without this, lintVitalRelease fails assembleRelease.
        disable 'ExpiredTargetSdkVersion'
        // A HOME app is reached with the Home button, not from an app row.
        disable 'MissingLeanbackLauncher'
    }

    testOptions {
        unitTests.returnDefaultValues = true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
        // java.time (OffsetDateTime/LocalDateTime/Instant) is API 26+; desugaring back to minSdk 25.
        coreLibraryDesugaringEnabled true
    }
}

dependencies {
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.0.4'
    // ResourcesCompat.getFont() replaces Resources.getFont() (API 26) for minSdk 25.
    implementation 'androidx.core:core:1.13.1'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.dynamicanimation:dynamicanimation:1.0.0'
    // Send to TV player (PROTOCOL.md Cast): progressive MP4/MKV/WebM/MPEG-TS over http(s) and local files.
    implementation 'androidx.media3:media3-exoplayer:1.4.1'
    // JVM unit tests of the Omarchy Link core against omarchy-link/docs/vectors.json
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20231013'
}
